<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% if noindex %}<meta name="robots" content="noindex, nofollow">{% endif %}
<title>{% block title %}김종률식 토지 급매 탐지기{% endblock %}</title>
<style>
  :root {
    --bg: #f7f7f5; --card: #ffffff; --text: #1a1a1a; --muted: #6b6b6b;
    --border: #e5e3de; --accent: #2f6f4f;
    --ok: #1f8a4c; --warn: #b8860b; --danger: #c0392b; --block: #8e44ad; --gray: #888;
  }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
         background: var(--bg); color: var(--text); margin: 0; padding: 0 0 60px; }
  header { background: var(--accent); color: white; padding: 18px 28px; }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 4px 0 0; font-size: 13px; opacity: .85; }
  .wrap { max-width: 1100px; margin: 24px auto; padding: 0 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px;
          padding: 18px 20px; margin-bottom: 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
  tr:hover td { background: #fafaf7; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px;
           font-weight: 600; color: white; white-space: nowrap; }
  .b-ok { background: var(--ok); }
  .b-warn { background: var(--warn); }
  .b-danger { background: var(--danger); }
  .b-block { background: var(--block); }
  .b-gray { background: var(--gray); }
  .filters { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; margin-bottom: 14px; }
  .filters label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .filters input, .filters select { padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; }
  .filters button { padding: 7px 16px; border: none; border-radius: 6px; background: var(--accent);
                     color: white; cursor: pointer; font-size: 13px; }
  .score { font-weight: 700; font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); font-size: 13px; }
  .section h3 { margin: 0 0 10px; font-size: 15px; }
  .section ul { margin: 0; padding-left: 20px; }
  .section li { margin-bottom: 10px; line-height: 1.65; font-size: 14px; }
  .stat-row { display: flex; gap: 28px; flex-wrap: wrap; margin-bottom: 6px; }
  .stat .k { font-size: 12px; color: var(--muted); }
  .stat .v { font-size: 16px; font-weight: 600; }
  .back { display: inline-block; margin-bottom: 14px; }
  strong { color: var(--accent); }
  @media (max-width: 700px) {
    .wrap { margin: 14px auto; padding: 0 12px; }
    header { padding: 14px 16px; }
    header h1 { font-size: 17px; }
    header p { font-size: 12px; }
    table { display: block; overflow-x: auto; white-space: nowrap; }
    .card { padding: 14px 15px; margin-bottom: 12px; }
    .section li { font-size: 15px; line-height: 1.7; }
    .stat-row { gap: 16px 22px; }
    .stat .v { font-size: 15px; }
    h2 { font-size: 18px; }
    h3 { font-size: 15px; }
  }
</style>
</head>
<body>
<header>
  <h1>김종률식 토지 급매 탐지기</h1>
  <p>경기도 공매 물건 · 시세 기준선 · 건축가능성 판정</p>
</header>
<div class="wrap">
{% block content %}{% endblock %}
</div>
</body>
</html>
