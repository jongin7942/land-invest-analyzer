<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}아파트 투자분석{% endblock %}</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* ═══════════════════════════════════════════════════════════════════
   개원노트 디자인 시스템에서 토큰을 그대로 가져왔습니다
   (pediatric-location-analyzer/app/ui/styles.css).
   클래스 이름은 기존 것을 유지해 템플릿을 다시 쓰지 않았습니다.
   ═══════════════════════════════════════════════════════════════════ */
:root{
  --brand-navy:#0F2742; --brand-navy-deep:#0A1C30;
  --brand-teal-dark:#0E6B78; --brand-teal:#1FA6B6; --brand-teal-strong:#0F8796;

  --bg-page:#F7FAFC; --bg-card:#FFFFFF; --bg-soft:#F1F7F9; --bg-hover:#F0FAFB;

  --text-primary:#102132; --text-secondary:#5F6B7A; --text-muted:#8694A3;

  --border-light:#E4EAF0; --border-medium:#D4DEE7;

  --success:#208A5D; --success-bg:#E8F6EF;
  --warning:#B7791F; --warning-bg:#FDF4E3;
  --danger:#C94A4A;  --danger-bg:#FBEDED;

  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
  --space-5:24px; --space-6:32px; --space-7:48px; --space-8:64px;

  --radius-sm:8px; --radius-md:12px; --radius-lg:18px; --radius-xl:24px;
  --radius-pill:999px;

  --shadow-sm:0 1px 2px rgba(15,39,66,.05);
  --shadow-md:0 4px 16px rgba(15,39,66,.07);
  --shadow-lg:0 18px 48px rgba(2,18,38,.13),0 4px 14px rgba(2,18,38,.07);

  --ease:160ms ease;
  --shell-max:1180px;
  --font-sans:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,
              "Segoe UI","Noto Sans KR","Malgun Gothic",sans-serif;

  /* 값의 성격 — 색만으로 구분하지 않고 항상 텍스트와 함께 씁니다 */
  --data-current:var(--brand-teal-dark);
  --data-estimated:#8A6D3B;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg-page);color:var(--text-primary);
  font-family:var(--font-sans);font-size:15px;line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--brand-teal-strong);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3{letter-spacing:-.02em;color:var(--text-primary)}

/* ── 상단 네이비 밴드 ─────────────────────────────────────────────── */
.band{
  background:
    radial-gradient(900px 420px at 78% 8%, rgba(31,166,182,.30), transparent 62%),
    radial-gradient(620px 380px at 12% 100%, rgba(31,166,182,.14), transparent 60%),
    linear-gradient(135deg,var(--brand-navy-deep) 0%,var(--brand-navy) 46%,#12506B 100%);
  border-radius:0 0 var(--radius-xl) var(--radius-xl);
  margin-bottom:var(--space-6);
}
.band .wrap{display:flex;align-items:center;gap:var(--space-5);
  height:66px;color:#fff}
.band b{font-size:15.5px;font-weight:700;letter-spacing:-.02em;
  color:rgba(255,255,255,.95)}
.band nav{display:flex;gap:var(--space-1);margin-left:auto}
.band nav a{
  color:rgba(255,255,255,.82);font-size:13.5px;font-weight:600;
  padding:7px 14px;border-radius:var(--radius-pill);transition:var(--ease);
}
.band nav a:hover{background:rgba(255,255,255,.10);
  color:#fff;text-decoration:none}

.wrap{max-width:var(--shell-max);margin:0 auto;padding:0 var(--space-5)}
main{padding-bottom:var(--space-8)}

h1{font-size:27px;font-weight:750;margin:0 0 var(--space-1)}
h2{font-size:16px;font-weight:700;color:var(--brand-navy);
  margin:var(--space-7) 0 var(--space-3)}
.sub{color:var(--text-secondary);font-size:13.5px;margin:0 0 var(--space-5)}

/* ── 카드 ────────────────────────────────────────────────────────── */
.card{
  background:var(--bg-card);border:1px solid var(--border-light);
  border-radius:var(--radius-md);padding:var(--space-5);
  margin-bottom:var(--space-4);box-shadow:var(--shadow-sm);
}
.card:hover{box-shadow:var(--shadow-md)}
.grid{display:grid;gap:var(--space-4)}
.g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}

.k{font-size:11.5px;font-weight:700;color:var(--text-secondary);
  letter-spacing:.01em}
.stat{font-size:27px;font-weight:750;letter-spacing:-.03em;margin:var(--space-1) 0 0;
  font-variant-numeric:tabular-nums;color:var(--brand-navy)}
.stat small{font-size:13px;font-weight:500;color:var(--text-muted);margin-left:5px}
.note{color:var(--text-secondary);font-size:12.5px;line-height:1.6}

/* ── 표 ──────────────────────────────────────────────────────────── */
table{width:100%;border-collapse:collapse}
th{
  text-align:left;font-size:11.5px;font-weight:700;color:var(--text-secondary);
  background:var(--bg-soft);padding:10px var(--space-3);
  border-bottom:1px solid var(--border-medium);white-space:nowrap;
}
td{padding:12px var(--space-3);font-size:13.5px;color:var(--text-primary);
  border-bottom:1px solid var(--border-light);vertical-align:top}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}

/* ── 뱃지 / 칩 ───────────────────────────────────────────────────── */
.tag{
  display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;
  border-radius:var(--radius-pill);background:var(--bg-soft);
  color:var(--brand-teal-dark);border:1px solid var(--border-light);
  white-space:nowrap;
}
.tag.warn{background:var(--warning-bg);color:var(--warning);border-color:#F0DFBC}
.tag.unknown{background:var(--danger-bg);color:var(--danger);border-color:#F1D5D5}
.unknown{color:var(--danger);font-weight:650}

/* 순위 원형 배지 */
.rank{
  display:inline-flex;align-items:center;justify-content:center;
  width:30px;height:30px;border-radius:50%;font-size:14px;font-weight:800;
  color:#fff;background:var(--border-medium);flex-shrink:0;
}
.rank.r1{background:#E9A32B}
.rank.r2{background:#9FB0BF}
.rank.r3{background:#C08457}

/* ── 폼 ──────────────────────────────────────────────────────────── */
form.inline{display:flex;gap:var(--space-3);flex-wrap:wrap;align-items:flex-end}
label{display:block;font-size:11.5px;font-weight:700;color:var(--text-secondary);
  margin-bottom:5px}
input[type=text],input[type=number]{
  background:#fff;color:var(--text-primary);border:1px solid var(--border-medium);
  border-radius:var(--radius-sm);padding:9px 12px;font-family:inherit;font-size:14px;
  min-width:120px;transition:var(--ease);
}
input[type=text]:focus,input[type=number]:focus{
  outline:none;border-color:var(--brand-teal);
  box-shadow:0 0 0 3px rgba(31,166,182,.14);
}
button,.btn{
  background:var(--brand-teal-strong);color:#fff;border:0;
  border-radius:var(--radius-sm);padding:10px 20px;font-family:inherit;
  font-size:14px;font-weight:650;cursor:pointer;transition:var(--ease);
  display:inline-block;
}
button:hover,.btn:hover{background:var(--brand-teal-dark);text-decoration:none}
.check{display:flex;align-items:center;gap:7px;font-size:13.5px;padding-bottom:9px}
.check input{accent-color:var(--brand-teal-strong);width:16px;height:16px}
.check label{margin:0;font-size:13.5px;font-weight:500;color:var(--text-primary)}

/* ── 경고 배너 ───────────────────────────────────────────────────── */
.banner{
  border-left:3px solid var(--warning);background:var(--warning-bg);
  padding:var(--space-3) var(--space-4);border-radius:0 var(--radius-sm) var(--radius-sm) 0;
  font-size:13.5px;margin:var(--space-4) 0;color:#6B4E17;
}
.banner code{background:rgba(0,0,0,.06);padding:1px 6px;border-radius:4px;
  font-size:12.5px}

/* ── 진행 바 ─────────────────────────────────────────────────────── */
.bar{height:6px;background:var(--border-light);border-radius:var(--radius-pill);
  overflow:hidden;margin-top:var(--space-2)}
.bar i{display:block;height:100%;background:var(--brand-teal);
  border-radius:var(--radius-pill)}

code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}

@media (max-width:640px){
  .band .wrap{height:auto;padding-top:var(--space-3);padding-bottom:var(--space-3);
    flex-wrap:wrap;gap:var(--space-2)}
  .band nav{margin-left:0;flex-wrap:wrap}
  h1{font-size:23px}
}
</style>
</head>
<body>
<header class="band"><div class="wrap">
  <b>아파트 투자분석</b>
  <nav>
    <a href="/">순위</a>
    <a href="/search">단지 검색</a>
    <a href="/status">데이터 현황</a>
    <a href="/unmatched">미매칭</a>
  </nav>
</div></header>
<main><div class="wrap">{% block body %}{% endblock %}</div></main>
</body>
</html>
