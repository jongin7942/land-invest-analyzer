<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}아파트 투자분석{% endblock %}</title>
<style>
:root{
  --bg:#fbfbfa; --panel:#fff; --ink:#1c1b19; --muted:#6b6862; --line:#e6e3dd;
  --accent:#2f5d50; --accent-soft:#e8f0ec;
  --unknown:#b4531a; --unknown-soft:#fdf0e6;
  --ok:#2f5d50; --warn:#8a6d1f;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171614; --panel:#1f1e1b; --ink:#eceae5; --muted:#9b968d; --line:#33312c;
    --accent:#7fbfa8; --accent-soft:#20302b;
    --unknown:#e08a4e; --unknown-soft:#2e2018;
    --ok:#7fbfa8; --warn:#c9a94a;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.6 -apple-system,"Segoe UI","Malgun Gothic",sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
header{border-bottom:1px solid var(--line);background:var(--panel)}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header .wrap{display:flex;align-items:center;gap:22px;height:56px}
header b{font-size:15px;letter-spacing:-.2px}
header nav{display:flex;gap:16px;font-size:14px}
main{padding:28px 0 64px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.3px}
h2{font-size:15px;margin:32px 0 10px;color:var(--muted);font-weight:600}
.sub{color:var(--muted);font-size:13px;margin:0 0 20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:18px 20px;margin-bottom:16px}
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.stat{font-size:26px;font-weight:650;letter-spacing:-.5px;margin:2px 0 0}
.stat small{font-size:13px;font-weight:400;color:var(--muted);margin-left:4px}
.k{font-size:12px;color:var(--muted);text-transform:none}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);
  vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;
  background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tag.unknown{background:var(--unknown-soft);color:var(--unknown)}
.tag.warn{background:var(--unknown-soft);color:var(--warn)}
.unknown{color:var(--unknown);font-weight:600}
.note{color:var(--muted);font-size:12.5px}
form.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
input[type=text],input[type=number]{background:var(--bg);color:var(--ink);
  border:1px solid var(--line);border-radius:7px;padding:7px 10px;font:inherit;
  font-size:14px;min-width:120px}
button{background:var(--accent);color:#fff;border:0;border-radius:7px;
  padding:8px 16px;font:inherit;font-size:14px;cursor:pointer}
button:hover{opacity:.9}
.check{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink);
  padding-bottom:8px}
.check input{accent-color:var(--accent)}
.banner{border-left:3px solid var(--unknown);background:var(--unknown-soft);
  padding:12px 14px;border-radius:0 8px 8px 0;font-size:13.5px;margin:14px 0}
.bar{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}
</style>
</head>
<body>
<header><div class="wrap">
  <b>아파트 투자분석</b>
  <nav>
    <a href="/">대시보드</a>
    <a href="/search">단지 검색</a>
    <a href="/unmatched">미매칭</a>
  </nav>
</div></header>
<main><div class="wrap">{% block body %}{% endblock %}</div></main>
</body>
</html>
