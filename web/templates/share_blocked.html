<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>아파트 투자 후보</title>
<style>
  body { font-family: "IBM Plex Sans KR", "Malgun Gothic", system-ui, sans-serif; background: #141F2C; color: #fff; margin: 0; display: flex; min-height: 100vh; align-items: center; justify-content: center; word-break: keep-all; overflow-wrap: anywhere; }
  .box { background: #fff; color: #141F2C; padding: 28px 30px; border-radius: 12px; max-width: 420px; margin: 20px; box-shadow: 0 8px 30px rgba(0,0,0,.3); }
  h1 { font-size: 20px; margin: 0 0 10px; }
  p { margin: 6px 0; line-height: 1.5; }
  .muted { color: #5F6E7E; font-size: 13px; }
</style>
</head>
<body>
<div class="box">
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  <p class="muted">이 페이지는 초대 링크를 받은 사람만, 처음 연 기기에서만 볼 수 있습니다. 링크를 보내준 분께 새 링크를 요청하세요.</p>
</div>
</body>
</html>
